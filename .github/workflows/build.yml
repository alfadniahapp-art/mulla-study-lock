name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # إنشاء مجلد الأندرويد تلقائياً لأننا نعمل من الهاتف
      - name: Generate Android Folder
        run: flutter create . --platforms=android --project-name mulla_study_lock
        
      # جلب المكتبات
      - name: Install dependencies
        run: flutter pub get
        
      # بناء ملف APK
      - name: Build APK
        run: flutter build apk --debug
        
      # رفع الملف لكي تحمله
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mulla-study-lock-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
